<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Order Successful - Cement Mall</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }


        header {
            background: #111;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }


        header h1 {
            font-size: 28px;
        }


        header a {
            color: white;
            text-decoration: none;
            background: #e5a900;
            padding: 12px 22px;
            border-radius: 8px;
            font-weight: bold;
        }


        .container {
            max-width: 850px;
            margin: 50px auto;
            padding: 0 20px;
        }


        .success-box {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }


        .success-title {
            text-align: center;
            color: #137333;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 30px;
        }


        .customer-details {
            background: #f0fff0;
            border: 1px solid #b7dfb7;
            border-radius: 10px;
            padding: 22px;
            margin-bottom: 30px;
        }


        .customer-details h2 {
            margin-bottom: 15px;
        }


        .detail {
            font-size: 17px;
            margin: 10px 0;
        }


        .order-items h2 {
            margin-bottom: 15px;
        }


        .item {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }


        .item-name {
            font-weight: bold;
        }


        .item-info {
            color: #777;
            margin-top: 5px;
        }


        .item-price {
            font-weight: bold;
        }


        .total {
            display: flex;
            justify-content: space-between;
            border-top: 2px solid #222;
            margin-top: 20px;
            padding-top: 20px;
            font-size: 24px;
            font-weight: bold;
        }


        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }


        .buttons a {
            flex: 1;
            text-align: center;
            padding: 15px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }


        .shop-btn {
            background: #111;
            color: white;
        }


        .home-btn {
            background: #e5a900;
            color: white;
        }


        .no-order {
            text-align: center;
            padding: 50px;
        }


        @media (max-width: 600px) {

            header {
                padding: 15px 20px;
            }

            header h1 {
                font-size: 21px;
            }

            header a {
                padding: 10px;
            }

            .success-box {
                padding: 22px;
            }

            .success-title {
                font-size: 24px;
            }

            .buttons {
                flex-direction: column;
            }
        }

    </style>

</head>


<body>


<header>

    <h1>🏗️ Cement Mall</h1>

    <a href="shop.html">
        ← Back to Shop
    </a>

</header>



<div class="container">

    <div
        class="success-box"
        id="successBox"
    >

        <div class="success-title">

            ✅ Order Placed Successfully!

        </div>


        <!-- CUSTOMER DETAILS -->

        <div class="customer-details">

            <h2>
                Customer Details
            </h2>


            <div class="detail">

                <strong>Name:</strong>

                <span id="customerName"></span>

            </div>


            <div class="detail">

                <strong>Phone:</strong>

                <span id="customerPhone"></span>

            </div>


            <div class="detail">

                <strong>Delivery Address:</strong>

                <span id="customerAddress"></span>

            </div>


            <div
                class="detail"
                id="orderIdBox"
            >

                <strong>Order ID:</strong>

                <span id="orderId"></span>

            </div>

        </div>



        <!-- ORDER ITEMS -->

        <div class="order-items">

            <h2>
                Order Details
            </h2>


            <div id="orderItems"></div>


            <div class="total">

                <span>
                    Total
                </span>

                <span id="orderTotal">
                    ₹0
                </span>

            </div>

        </div>



        <div class="buttons">

            <a
                href="shop.html"
                class="shop-btn"
            >
                Continue Shopping
            </a>


            <a
                href="index.html"
                class="home-btn"
            >
                Home
            </a>

        </div>

    </div>


    <div
        class="success-box no-order"
        id="noOrder"
        style="display:none;"
    >

        <h2>
            No recent order found.
        </h2>

        <br>

        <a href="shop.html">
            Go to Shop
        </a>

    </div>

</div>



<script>

    // ==========================================
    // GET LAST ORDER
    // ==========================================

    const lastOrder =
        JSON.parse(
            localStorage.getItem("lastOrder")
        );


    const successBox =
        document.getElementById(
            "successBox"
        );


    const noOrder =
        document.getElementById(
            "noOrder"
        );


    // ==========================================
    // CHECK ORDER
    // ==========================================

    if (!lastOrder) {

        successBox.style.display =
            "none";

        noOrder.style.display =
            "block";

    } else {


        // ======================================
        // CUSTOMER DETAILS
        // ======================================

        document.getElementById(
            "customerName"
        ).textContent =
            lastOrder.customer.name;


        document.getElementById(
            "customerPhone"
        ).textContent =
            lastOrder.customer.phone;


        document.getElementById(
            "customerAddress"
        ).textContent =
            lastOrder.customer.address;


        // ======================================
        // ORDER ID
        // ======================================

        if (lastOrder.orderId) {

            document.getElementById(
                "orderId"
            ).textContent =
                lastOrder.orderId;

        } else {

            document.getElementById(
                "orderIdBox"
            ).style.display =
                "none";

        }


        // ======================================
        // ORDER ITEMS
        // ======================================

        const orderItems =
            document.getElementById(
                "orderItems"
            );


        orderItems.innerHTML = "";


        lastOrder.items.forEach(
            function(item) {

                const price =
                    Number(item.price) || 0;


                const quantity =
                    Number(item.quantity) || 1;


                const itemTotal =
                    price * quantity;


                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "item";


                div.innerHTML = `

                    <div>

                        <div class="item-name">
                            ${item.name || "Product"}
                        </div>

                        <div class="item-info">
                            Quantity: ${quantity}
                        </div>

                    </div>

                    <div class="item-price">
                        ₹${itemTotal.toLocaleString("en-IN")}
                    </div>

                `;


                orderItems.appendChild(div);

            }
        );


        // ======================================
        // TOTAL
        // ======================================

        document.getElementById(
            "orderTotal"
        ).textContent =
            "₹" +
            Number(
                lastOrder.total
            ).toLocaleString("en-IN");

    }

</script>


</body>
</html>
