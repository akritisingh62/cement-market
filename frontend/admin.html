```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cement Mall | Admin</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f5f6f8;
    color:#18212b;
}

/* HEADER */

.header{
    height:72px;
    background:#111820;
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 6%;
}

.logo{
    font-size:24px;
    font-weight:900;
}

.logo span{
    color:#f5b400;
}

.shop-link{
    color:white;
    text-decoration:none;
    background:#f5b400;
    color:#111;
    padding:10px 16px;
    border-radius:7px;
    font-weight:800;
    font-size:14px;
}

/* PAGE */

.container{
    max-width:1200px;
    margin:auto;
    padding:35px 22px 60px;
}

.title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.title h1{
    font-size:30px;
}

.refresh{
    border:0;
    background:#111820;
    color:white;
    padding:11px 17px;
    border-radius:7px;
    cursor:pointer;
    font-weight:700;
}

.refresh:hover{
    background:#f5b400;
    color:#111;
}

/* STATS */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
    margin-bottom:25px;
}

.stat{
    background:white;
    border:1px solid #e3e6ea;
    border-radius:10px;
    padding:22px;
}

.stat p{
    color:#6b7280;
    font-size:13px;
    margin-bottom:8px;
}

.stat h2{
    font-size:27px;
}

/* ORDERS */

.orders{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.order{
    background:white;
    border:1px solid #e3e6ea;
    border-radius:10px;
    padding:20px;
}

.order-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #eee;
    padding-bottom:15px;
    margin-bottom:15px;
}

.order-id{
    font-weight:900;
}

.status{
    background:#fff3cd;
    color:#8a6200;
    padding:6px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:800;
}

.customer{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:18px;
}

.customer div{
    background:#f7f8fa;
    padding:12px;
    border-radius:7px;
}

.customer small{
    display:block;
    color:#6b7280;
    font-size:11px;
    margin-bottom:5px;
}

.customer strong{
    font-size:13px;
}

.items{
    border-top:1px solid #eee;
    padding-top:15px;
}

.item{
    display:flex;
    justify-content:space-between;
    padding:9px 0;
    font-size:14px;
}

.total{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    font-size:18px;
    font-weight:900;
    margin-top:15px;
}

.empty,
.loading,
.error{
    background:white;
    padding:70px;
    text-align:center;
    border-radius:10px;
    color:#6b7280;
}

/* MOBILE */

@media(max-width:700px){

    .stats{
        grid-template-columns:1fr;
    }

    .customer{
        grid-template-columns:1fr;
    }

    .title{
        gap:15px;
        align-items:flex-start;
        flex-direction:column;
    }

    .order-head{
        align-items:flex-start;
        gap:10px;
        flex-direction:column;
    }

}
</style>
</head>

<body>

<header class="header">

    <div class="logo">
        CEMENT <span>MALL</span>
    </div>

    <a
        href="shop.html"
        class="shop-link"
    >
        Go to Shop
    </a>

</header>


<main class="container">

    <div class="title">

        <h1>
            Orders Dashboard
        </h1>

        <button
            class="refresh"
            onclick="loadOrders()"
        >
            ↻ Refresh Orders
        </button>

    </div>


    <section class="stats">

        <div class="stat">

            <p>
                Total Orders
            </p>

            <h2 id="totalOrders">
                0
            </h2>

        </div>


        <div class="stat">

            <p>
                Total Items
            </p>

            <h2 id="totalItems">
                0
            </h2>

        </div>


        <div class="stat">

            <p>
                Total Revenue
            </p>

            <h2>
                ₹<span id="totalRevenue">0</span>
            </h2>

        </div>

    </section>


    <section
        class="orders"
        id="orders"
    >

        <div class="loading">
            Loading orders...
        </div>

    </section>

</main>


<script>

const API_URL =
    "http://localhost:5000";


async function loadOrders(){

    const container =
        document.getElementById(
            "orders"
        );

    container.innerHTML = `
        <div class="loading">
            Loading orders...
        </div>
    `;

    try{

        const response =
            await fetch(
                `${API_URL}/api/orders`
            );

        const data =
            await response.json();

        if(!data.success){

            throw new Error(
                data.message ||
                "Failed to fetch orders"
            );

        }

        const orders =
            data.orders || [];

        document.getElementById(
            "totalOrders"
        ).textContent =
            orders.length;


        let totalItems = 0;
        let totalRevenue = 0;

        orders.forEach(order => {

            const items =
                order.items || [];

            items.forEach(item => {

                totalItems +=
                    Number(
                        item.quantity || 0
                    );

            });

            totalRevenue +=
                Number(
                    order.total ||
                    order.totalAmount ||
                    0
                );

        });


        document.getElementById(
            "totalItems"
        ).textContent =
            totalItems;


        document.getElementById(
            "totalRevenue"
        ).textContent =
            totalRevenue;


        if(orders.length === 0){

            container.innerHTML = `
                <div class="empty">
                    <h3>
                        No orders yet
                    </h3>

                    <p style="margin-top:8px;">
                        Orders placed from the
                        checkout page will appear here.
                    </p>
                </div>
            `;

            return;
        }


        container.innerHTML = "";


        orders.forEach((order,index) => {

            const customer =
                order.customer ||
                {};

            const items =
                order.items ||
                [];


            const orderNumber =
                order._id ||
                order.id ||
                `ORDER-${index + 1}`;


            const name =
                customer.name ||
                order.name ||
                "N/A";


            const phone =
                customer.phone ||
                order.phone ||
                "N/A";


            const address =
                customer.address ||
                order.address ||
                "N/A";


            const total =
                order.total ||
                order.totalAmount ||
                0;


            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "order";


            let itemsHTML = "";


            items.forEach(item => {

                const quantity =
                    item.quantity || 1;

                const price =
                    item.price || 0;


                itemsHTML += `

                    <div class="item">

                        <span>
                            ${item.name || "Product"}
                            × ${quantity}
                        </span>

                        <strong>
                            ₹${price * quantity}
                        </strong>

                    </div>

                `;

            });


            div.innerHTML = `

                <div class="order-head">

                    <div class="order-id">
                        Order #${orderNumber}
                    </div>

                    <div class="status">
                        ${order.status || "Placed"}
                    </div>

                </div>


                <div class="customer">

                    <div>

                        <small>
                            Customer
                        </small>

                        <strong>
                            ${name}
                        </strong>

                    </div>


                    <div>

                        <small>
                            Phone
                        </small>

                        <strong>
                            ${phone}
                        </strong>

                    </div>


                    <div>

                        <small>
                            Address
                        </small>

                        <strong>
                            ${address}
                        </strong>

                    </div>

                </div>


                <div class="items">

                    ${itemsHTML}

                </div>


                <div class="total">

                    <span>
                        Total:
                    </span>

                    <span>
                        ₹${total}
                    </span>

                </div>

            `;


            container.appendChild(div);

        });


    }catch(error){

        console.error(
            "Orders error:",
            error
        );

        container.innerHTML = `

            <div class="error">

                <h3>
                    Failed to load orders
                </h3>

                <p style="margin-top:8px;">
                    Make sure MongoDB and the
                    backend server are running.
                </p>

            </div>

        `;

    }

}


loadOrders();

</script>

</body>
</html>
```
