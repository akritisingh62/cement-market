<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us - Cement Mall</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .contact-page {
            max-width: 1100px;
            margin: 50px auto;
            padding: 20px;
        }

        .contact-title {
            text-align: center;
            margin-bottom: 40px;
        }

        .contact-title h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .contact-title p {
            color: #666;
            font-size: 16px;
        }

        .contact-container {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 30px;
        }

        .contact-info,
        .contact-form {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .contact-info h2,
        .contact-form h2 {
            margin-bottom: 25px;
        }

        .contact-item {
            margin-bottom: 25px;
        }

        .contact-item h3 {
            margin-bottom: 7px;
        }

        .contact-item p {
            margin: 0;
            color: #666;
            line-height: 1.6;
        }

        .contact-item a {
            color: inherit;
            text-decoration: none;
        }

        .contact-form input,
        .contact-form textarea {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 15px;
            box-sizing: border-box;
        }

        .contact-form textarea {
            min-height: 140px;
            resize: vertical;
        }

        .contact-form button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .contact-form button:hover {
            opacity: 0.9;
        }

        #formMessage {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            background: #e8f5e9;
            color: #2e7d32;
            text-align: center;
        }

        @media (max-width: 768px) {
            .contact-container {
                grid-template-columns: 1fr;
            }

            .contact-title h1 {
                font-size: 28px;
            }

            .contact-page {
                margin: 30px auto;
            }
        }
    </style>
</head>

<body>

    <!-- Contact Page -->
    <main class="contact-page">

        <div class="contact-title">
            <h1>Contact Us</h1>
            <p>Have a question? We'd love to hear from you.</p>
        </div>

        <div class="contact-container">

            <!-- Contact Information -->
            <div class="contact-info">

                <h2>Get In Touch</h2>

                <div class="contact-item">
                    <h3>📞 Phone</h3>
                    <p>
                        <a href="tel:+916205734975">
                            +91 62057 34975
                        </a>
                    </p>
                </div>

                <div class="contact-item">
                    <h3>📧 Email</h3>
                    <p>
                        <a href="mailto:akriti1592005@gmail.com">
                            akriti1592005@gmail.com
                        </a>
                    </p>
                </div>

                <div class="contact-item">
                    <h3>📍 Address</h3>
                    <p>
                        Meerut, Uttar Pradesh, India
                    </p>
                </div>

                <div class="contact-item">
                    <h3>🕒 Business Hours</h3>
                    <p>
                        Monday - Saturday<br>
                        9:00 AM - 7:00 PM
                    </p>
                </div>

            </div>


            <!-- Contact Form -->
            <div class="contact-form">

                <h2>Send Us a Message</h2>

                <form id="contactForm">

                    <input
                        type="text"
                        id="name"
                        placeholder="Your Name"
                        required
                    >

                    <input
                        type="email"
                        id="email"
                        placeholder="Your Email"
                        required
                    >

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Your Phone Number"
                    >

                    <textarea
                        id="message"
                        placeholder="Write your message..."
                        required
                    ></textarea>

                    <button type="submit">
                        Send Message
                    </button>

                </form>

                <div id="formMessage">
                    Your message has been received successfully!
                </div>

            </div>

        </div>

    </main>


    <script>
        document
            .getElementById("contactForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                document.getElementById("formMessage").style.display = "block";

                document.getElementById("contactForm").reset();

            });
    </script>

</body>
</html>
